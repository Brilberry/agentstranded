[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstranded"
version = "0.1.0"
description = "Autonomous survivors in a seeded island simulation powered by bbagents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "bbagents @ git+https://github.com/Brilberry/bbagents.git@0aea6a022f1d3082cbea6124334bc3a5f641b601",
  "pygame-ce>=2.5,<3",
  "json5>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Brilberry/agentstranded"

[tool.setuptools.packages.find]
include = ["agentstranded*"]

[tool.setuptools.package-data]
agentstranded = ["*.md", "*.png", "configs/*.json", "configs/*.json5"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
