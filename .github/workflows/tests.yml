name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check agentstranded tests
      - run: pytest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Check UTF-8 I/O under a Windows-style filesystem locale
        if: matrix.os == 'ubuntu-latest'
        run: pytest tests/test_documentation.py tests/test_island_report_view.py tests/test_text_encoding.py tests/test_island_competition.py
        env:
          AGENTSTRANDED_TEST_ENCODING: cp1252
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
